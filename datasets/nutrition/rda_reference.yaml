# datasets/nutrition/rda_reference.yaml
# Generic adult reference values — NOT personalized (no age/sex/pregnancy
# adjustment; see docs/design/nutrition-micronutrient-lookup.md in personal-os,
# "Out of scope"). Convention: generic US/EU Daily Value, chosen so this pairs
# with the USDA FDC source already used for the food data itself — one
# citation trail, not two.
#
# Enforced by scripts/validate-nutrition-data.mjs: every key in
# schema.yaml's food.micronutrient_fields must have an entry here.
#
# Units must match the corresponding food field exactly (see schema.yaml's
# unit-convention note, especially vitamin_a_ug = mcg RAE and
# vitamin_d_ug = mcg — not IU for either).

iron_mg: 18
calcium_mg: 1300
magnesium_mg: 420
zinc_mg: 11
potassium_mg: 4700
sodium_mg: 2300
iodine_ug: 150
vitamin_a_ug: 900
vitamin_d_ug: 20
vitamin_e_mg: 15
vitamin_k_ug: 120
vitamin_b1_mg: 1.2
vitamin_b2_mg: 1.3
vitamin_b6_mg: 1.7
vitamin_b12_ug: 2.4
folate_ug: 400
vitamin_c_mg: 90
omega3_g: 1.6
