# datasets/nutrition/rda_reference.yaml
# Generic adult Daily Value benchmarks — NOT individual RDAs or AIs and NOT
# personalized for age, sex or pregnancy. Iron 18 mg and calcium 1300 mg are
# label Daily Values, not requirements for every adult. Potassium 4700 mg is
# also a label Daily Value; the US adult male AI is 3400 mg.
# omega3_g: 1.6 below is the adult male AI for ALA alone. Individual food
# omega3_g records can mix ALA with EPA/DPA/DHA, so a percent-of-reference
# calculation for omega3_g is invalid and the catalog suppresses it.
#
# Enforced by scripts/validate-nutrition-data.mjs: every key in
# schema.yaml's food.micronutrient_fields must have an entry here.
#
# Units must match the corresponding food field exactly (see schema.yaml's
# unit-convention note, especially vitamin_a_ug = mcg RAE and
# vitamin_d_ug = mcg — not IU for either).

iron_mg: 18
calcium_mg: 1300
magnesium_mg: 420
zinc_mg: 11
potassium_mg: 4700
sodium_mg: 2300
iodine_ug: 150
vitamin_a_ug: 900
vitamin_d_ug: 20
vitamin_e_mg: 15
vitamin_k_ug: 120
vitamin_b1_mg: 1.2
vitamin_b2_mg: 1.3
vitamin_b6_mg: 1.7
vitamin_b12_ug: 2.4
folate_ug: 400
vitamin_c_mg: 90
omega3_g: 1.6
