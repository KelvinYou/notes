# datasets/nutrition/foods/supplements.yaml
# Not in the plan's original 4-file sketch — see ../README.md — "Food categories" note.
# No protein/carb/fat macros apply; these are dosed by count/weight, not eaten as food.

- id: creatine_monohydrate
  name: Creatine Monohydrate
  basis: 1_serving
  serving_g: 5
  source: "personal shopping records (Malaysia), unverified"
  last_verified: "2026-08-19"
  notes: "Evidence grade and dosing timing live in docs/health/nutrition (protein-and-energy.md family); this record is price/serving-size only."

- id: magnesium_glycinate
  name: Magnesium Glycinate
  basis: 1_piece
  source: "personal shopping records (Malaysia), unverified"
  last_verified: "2026-08-19"

- id: iodine_supplement
  name: Iodine (kelp/potassium iodide tablet)
  basis: 1_piece
  iodine_ug: 150
  source: "commercial supplement label, not yet a specific purchased product — verify against actual bottle"
  last_verified: "2026-09-28"
  notes: >-
    Added because the entire nutrition dataset has zero foods with researched iodine
    data (not "confirmed zero" — never researched; see schema.yaml's blank-vs-zero
    convention). Rather than guess food-composition iodine values (dairy/egg/seafood
    iodine varies hugely by region and processing, and getting it wrong has real
    thyroid-health consequences), this uses a labeled supplement dose instead —
    same pattern as magnesium_glycinate/creatine_monohydrate in this file. Confirm
    the actual product's label states ~150ug (100% DV) per tablet before relying on
    this number; if the real label differs, update this value, not standard_week.md.
